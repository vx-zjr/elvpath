[package]
name = "elvpath"
version = "0.1.0"
description = "Cross-platform developer environment deployment GUI"
authors = ["ElvPath Contributors"]
edition = "2021"
default-run = "elvpath"

[lib]
name = "elvpath_lib"
path = "src/lib.rs"

[[bin]]
name = "elvpath"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
